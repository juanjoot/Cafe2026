services:
  auth-service:
    command: node dist/apps/microservices/auth-service/src/main.js
    environment:
      - DATABASE_URL=mongodb://host.docker.internal:27017/auth
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gateway:
    volumes:
      - ./apps/api-gateway:/usr/src/app/apps/api-gateway
    command: npm --prefix /usr/src/app/apps/api-gateway run start:dev

  recommendation-service:
    environment:
      - REDIS_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
