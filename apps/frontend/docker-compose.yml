version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: cafe-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001

  api-gateway:
    build:
      context: ./api-gateway
    container_name: cafe-api-gateway
    ports:
      - "3001:3000"
    environment:
      - JWT_SECRET=miclaveultrasecreta
    depends_on:
      - product-service
      - auth-service

  product-service:
    image: cafe-product-service
    build:
      context: ./product-service
    container_name: cafe-product-service
    ports:
      - "3002:3000"

  auth-service:
    image: cafe-auth-service
    build:
      context: ./auth-service
    container_name: cafe-auth-service
    ports:
      - "3003:3000"