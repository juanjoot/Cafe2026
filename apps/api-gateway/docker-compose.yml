version: '3.8'

services:
  api-gateway:
    build:
      context: .
    container_name: api-gateway
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - product-service
      - auth-service

  product-service:
    image: product-service:latest
    build:
      context: ../product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=database
    # otros valores como DB_USER, DB_PASSWORD, etc. deben definirse según tu proyecto

  auth-service:
    image: auth-service:latest
    build:
      context: ../auth-service
    container_name: auth-service
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}

