apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cafe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tu-usuario/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cafe-ecommerce
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
