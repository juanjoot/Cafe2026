apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cafe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: tu-usuario/product-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/products
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cafe-ecommerce
spec:
  selector:
    app: product-service
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP