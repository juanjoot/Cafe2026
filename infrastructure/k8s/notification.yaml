apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cafe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tu-usuario/notification-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cafe-ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
