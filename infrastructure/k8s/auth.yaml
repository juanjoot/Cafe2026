apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cafe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: tu-usuario/auth-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: mongodb://auth-db:27017/auth
            - name: REDIS_HOST
              value: redis
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cafe-ecommerce
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
