apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: cafe-ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: cafe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: auth-storage
      volumes:
        - name: auth-storage
          persistentVolumeClaim:
            claimName: auth-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: cafe-ecommerce
spec:
  selector:
    app: auth-db
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP